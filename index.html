<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>I Like You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600;700&display=swap">
<style>
  /* Layout: one big beating heart centered on the page, a quiet caption underneath, small hearts drifting behind. */
  :root {
    --bg: #FFE9EF;
    --ink: #3A1230;
    --muted: #7A4A66;
    --heart: #E8266A;
    --heart-ink: #FFFFFF;
    --shine: #FFFFFF;
    --soft: #FFD0DE;
    --butter: #FFD36B;
    --font-display: 'Bagel Fat One', 'Trebuchet MS', system-ui, sans-serif;
    --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #22101D;
      --ink: #FFE6EE;
      --muted: #D9A9BF;
      --heart: #FF5C8A;
      --heart-ink: #2A0A1A;
      --shine: #FFFFFF;
      --soft: #3F1B35;
      --butter: #FFD36B;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #22101D;
    --ink: #FFE6EE;
    --muted: #D9A9BF;
    --heart: #FF5C8A;
    --heart-ink: #2A0A1A;
    --shine: #FFFFFF;
    --soft: #3F1B35;
    --butter: #FFD36B;
    color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 18px;
    line-height: 1.5;
    padding-inline: max(16px, 5vw);
    padding-block: 5vh;
    overflow-x: hidden;
  }

  .drift { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .drift span {
    position: absolute;
    bottom: -40px;
    color: var(--heart);
    opacity: 0.2;
    animation: rise 15s linear infinite;
  }
  .drift span:nth-child(1) { left: 5%;  animation-delay: 0s;  font-size: 22px; }
  .drift span:nth-child(2) { left: 20%; animation-delay: 4s;  font-size: 34px; }
  .drift span:nth-child(3) { left: 38%; animation-delay: 8s;  font-size: 20px; }
  .drift span:nth-child(4) { left: 62%; animation-delay: 2s;  font-size: 30px; }
  .drift span:nth-child(5) { left: 78%; animation-delay: 10s; font-size: 24px; }
  .drift span:nth-child(6) { left: 92%; animation-delay: 6s;  font-size: 32px; }
  @keyframes rise {
    from { transform: translateY(0) rotate(-8deg); }
    to   { transform: translateY(-115vh) rotate(12deg); }
  }

  main {
    position: relative;
    max-width: 560px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .heart-btn {
    display: block;
    width: min(100%, 460px);
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .heart-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 6px; border-radius: 24px; }
  .heart-btn svg { display: block; width: 100%; height: auto; overflow: visible; }

  .ground { fill: var(--soft); }
  .heart-shape { fill: var(--heart); stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
  .shine { fill: var(--shine); opacity: 0.38; }
  .words {
    font-family: var(--font-display);
    fill: var(--heart-ink);
    text-anchor: middle;
  }

  .beat { transform-box: fill-box; transform-origin: 50% 70%; animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat {
    0%, 55%, 100% { transform: scale(1); }
    10% { transform: scale(1.07); }
    22% { transform: scale(0.98); }
    32% { transform: scale(1.04); }
  }
  .heart-btn:active .beat { animation-play-state: paused; transform: scale(0.95); }

  .caption {
    margin: 0;
    color: var(--muted);
    font-weight: 600;
    text-align: center;
    min-height: 1.5em;
  }
  .sign {
    margin: 0;
    font-family: var(--font-display);
    font-size: 1.5rem;
    color: var(--heart);
    text-align: center;
  }
  .sign[hidden] { display: none !important; }
  .for {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    line-height: 1.1;
    color: var(--ink);
    text-align: center;
  }
  .for em { font-style: normal; color: var(--heart); }

  .pop {
    position: fixed;
    left: 0;
    top: 0;
    pointer-events: none;
    z-index: 10;
    line-height: 1;
    will-change: transform, opacity;
  }

  @media (prefers-reduced-motion: reduce) {
    .drift { display: none; }
    .beat { animation: none; }
  }
</style>
</head>
<body>

<div class="drift" aria-hidden="true"><span>&#9829;&#xFE0E;</span><span>&#9829;&#xFE0E;</span><span>&#9829;&#xFE0E;</span><span>&#9829;&#xFE0E;</span><span>&#9829;&#xFE0E;</span><span>&#9829;&#xFE0E;</span></div>

<main>
  <p class="for">For <em>Angel</em></p>
  <button class="heart-btn" id="heart" type="button" aria-label="I like you. Tap for more hearts.">
    <svg viewBox="-10 -10 220 210" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <ellipse class="ground" cx="100" cy="188" rx="64" ry="9"/>
      <g class="beat">
        <path class="heart-shape" d="M100 172 C18 112 -8 62 28 28 C54 5 90 15 100 44 C110 15 146 5 172 28 C208 62 182 112 100 172 Z"/>
        <path class="shine" d="M44 44 C50 34 64 30 74 36 C64 38 56 44 52 54 C46 56 40 52 44 44 Z"/>
        <text class="words" x="100" y="86" font-size="34">I like</text>
        <text class="words" x="100" y="126" font-size="46">you</text>
      </g>
    </svg>
  </button>
  <p class="caption" id="caption">Tap the heart.</p>
  <p class="sign" id="sign" hidden></p>
</main>

<script>
  // Change FROM to add a signature under the heart, for example "from Alex".
  var FROM = "";

  var heart = document.getElementById('heart');
  var caption = document.getElementById('caption');
  var sign = document.getElementById('sign');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var taps = 0;

  if (FROM) { sign.textContent = FROM; sign.hidden = false; }

  var captions = [
    "Tap the heart.",
    "Again.",
    "Yes, it is true.",
    "I really do.",
    "More than a little.",
    "Okay, now you know.",
    "Keep going, I do not mind."
  ];
  var colors = ['var(--heart)', 'var(--butter)', 'var(--ink)'];

  function pop(cx, cy) {
    if (reduceMotion || !document.body.animate) return;
    var count = 9;
    for (var i = 0; i < count; i++) {
      var el = document.createElement('span');
      el.className = 'pop';
      el.innerHTML = '&#9829;&#xFE0E;';
      el.style.color = colors[i % colors.length];
      el.style.fontSize = (14 + Math.random() * 20) + 'px';
      document.body.appendChild(el);
      var dx = (Math.random() - 0.5) * 260;
      var dy = -90 - Math.random() * 170;
      var rot = (Math.random() - 0.5) * 80;
      var anim = el.animate([
        { transform: 'translate(' + cx + 'px,' + cy + 'px) scale(0.4) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + (cx + dx) + 'px,' + (cy + dy) + 'px) scale(1.1) rotate(' + rot + 'deg)', opacity: 0 }
      ], { duration: 1100 + Math.random() * 700, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
      anim.onfinish = (function (node) { return function () { node.remove(); }; })(el);
    }
  }

  heart.addEventListener('click', function (e) {
    taps += 1;
    caption.textContent = captions[Math.min(taps, captions.length - 1)];
    var r = heart.getBoundingClientRect();
    var x = e.clientX || (r.left + r.width / 2);
    var y = e.clientY || (r.top + r.height / 2);
    pop(x, y);
  });
</script>

</body>
</html>
